name: Build and Deploy Wisper API

on:
  push:
    # dev only for now -- there is no prod deployment of wisper-api yet. When
    # prod exists, restore "main" here (the branch-conditional env/environment
    # expressions below already handle it).
    branches: ["dev"]
    paths-ignore:
      - "**/*.md"

env:
  IMAGE_TAG: ${{ github.ref_name == 'main' && 'latest' || 'dev' }}
  SERVICE: ${{ github.ref_name == 'main' && 'wisper-api' || 'wisper-api-dev' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Check for em/en dashes
        run: ./scripts/check-dashes.sh

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # The image takes NO build args: Wisper is 12-factor and receives all
      # configuration as runtime environment injected by the gateway from
      # Secrets Manager (env_secret_ref) at container-create time.
      - name: Build & Push multi-arch Docker image
        run: |
          IMAGE_URI=${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}
          GIT_SHA=$(git rev-parse --short HEAD)

          docker buildx create --use || true
          docker buildx inspect --bootstrap

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t $IMAGE_URI:$GIT_SHA \
            -t $IMAGE_URI:${{ env.IMAGE_TAG }} \
            --push .

      # Deploy = one authenticated call to the gateway's management API
      # (machine credential, deploy-only scope). The gateway ORIGIN is a secret
      # so no infrastructure hostname is committed to this public repo; the
      # service name is not sensitive and is selected by branch above.
      - name: Deploy via gateway
        run: |
          GIT_SHA=$(git rev-parse --short HEAD)

          TOKEN=$(curl -sf -X POST "${{ secrets.MGMT_TOKEN_URL }}" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -u "${{ secrets.MGMT_CLIENT_ID }}:${{ secrets.MGMT_CLIENT_SECRET }}" \
            -d "grant_type=client_credentials&scope=mgmt/deploy" | jq -r .access_token)

          echo "Deploying ${SERVICE} @ ${GIT_SHA} via gateway..."
          curl -sf -X POST "${{ secrets.MGMT_API_BASE }}/mgmt/services/${SERVICE}/deploy" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"tag\":\"${GIT_SHA}\"}"
